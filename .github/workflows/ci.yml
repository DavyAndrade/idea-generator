name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install

      - name: Type check (TypeScript)
        run: bun x tsc --noEmit

      - name: Rodar testes
        run: bun test

      - name: Build da PWA
        run: bun run build

      - name: Upload de artefato (dist)
        uses: actions/upload-artifact@v4
        with:
          name: pwa-dist
          path: dist
