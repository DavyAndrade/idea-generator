<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de fundo escuro com leve toque violeta -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181126"/>
      <stop offset="50%" stop-color="#0f0919"/>
      <stop offset="100%" stop-color="#07030d"/>
    </linearGradient>

    <!-- Brilho exterior da lâmpada -->
    <radialGradient id="lampGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente principal do bulbo da lâmpada -->
    <linearGradient id="bulbGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="35%" stop-color="#d8b4fe"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Gradiente do filamento de luz interna -->
    <linearGradient id="filamentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fae8ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>

    <!-- Gradiente da rosca metálica da base -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="30%" stop-color="#9333ea"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
  </defs>

  <!-- Fundo com cantos arredondados (squircle app icon) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Halo de iluminação/glow da lâmpada -->
  <circle cx="256" cy="220" r="190" fill="url(#lampGlow)"/>

  <!-- Raios de iluminação sutis (faíscas/centelhas criativas) -->
  <g stroke="#d8b4fe" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <!-- Topo -->
    <line x1="256" y1="52" x2="256" y2="76"/>
    <!-- Diagonais superiores -->
    <line x1="126" y1="106" x2="144" y2="124"/>
    <line x1="386" y1="106" x2="368" y2="124"/>
    <!-- Laterais -->
    <line x1="72" y1="220" x2="98" y2="220"/>
    <line x1="440" y1="220" x2="414" y2="220"/>
  </g>

  <!-- Centelha mágica / faísca no topo esquerdo da lâmpada -->
  <path d="M165 145 Q165 165 145 165 Q165 165 165 185 Q165 165 185 165 Q165 165 165 145 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M355 170 Q355 182 343 182 Q355 182 355 194 Q355 182 367 182 Q355 182 355 170 Z" fill="#fae8ff" opacity="0.8"/>

  <!-- Bulbo da lâmpada (Vidro roxo translúcido vibrante) -->
  <path d="M 256 90
           C 178 90 134 148 134 214
           C 134 262 165 292 192 332
           C 202 346 206 358 206 372
           L 306 372
           C 306 358 310 346 320 332
           C 347 292 378 262 378 214
           C 378 148 334 90 256 90 Z"
        fill="url(#bulbGrad)"/>

  <!-- Brilho especular curvo no lado esquerdo do bulbo -->
  <path d="M 180 135
           C 152 168 148 208 152 238
           C 150 212 158 175 188 145
           C 192 141 184 131 180 135 Z"
        fill="#ffffff"
        opacity="0.55"/>

  <!-- Filamento interno brilhante (Formato de 'L' estilizado e centelha Lumi) -->
  <path d="M 224 330
           L 224 230
           Q 224 200 240 190
           Q 256 180 272 190
           Q 288 200 288 230
           L 288 330"
        fill="none"
        stroke="#ffffff"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9"/>

  <!-- Centro de energia brilhante no coração do filamento -->
  <circle cx="256" cy="205" r="16" fill="#ffffff"/>
  <circle cx="256" cy="205" r="28" fill="#fdf4ff" opacity="0.6"/>

  <!-- Rosca metálica da base (3 frisos característicos de lâmpada) -->
  <path d="M 200 376 C 200 372 312 372 312 376 L 308 392 C 308 396 204 396 204 392 Z" fill="url(#baseGrad)"/>
  <path d="M 206 398 C 206 394 306 394 306 398 L 302 414 C 302 418 210 418 210 414 Z" fill="url(#baseGrad)"/>
  <path d="M 212 420 C 212 416 300 416 300 420 L 294 434 C 294 438 218 438 218 434 Z" fill="url(#baseGrad)"/>

  <!-- Ponta de contato inferior da lâmpada -->
  <path d="M 224 438 C 224 438 234 456 256 456 C 278 456 288 438 288 438 Z" fill="#4c1d95"/>
</svg>
