<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fundo: squircle escuro minimalista -->
  <rect width="512" height="512" rx="112" fill="#0d0914"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.25"/>

  <!-- Bulbo da lâmpada: contorno e preenchimento flat 2D roxo -->
  <path
    d="M 256 100
       C 184 100 144 148 144 214
       C 144 272 176 308 206 348
       C 216 358 224 370 224 384
       L 288 384
       C 288 370 296 358 306 348
       C 336 308 368 272 368 214
       C 368 148 328 100 256 100 Z"
    fill="#8b5cf6"
  />

  <!-- Contorno do bulbo para definição flat -->
  <path
    d="M 256 100
       C 184 100 144 148 144 214
       C 144 272 176 308 206 348
       C 216 358 224 370 224 384
       L 288 384
       C 288 370 296 358 306 348
       C 336 308 368 272 368 214
       C 368 148 328 100 256 100 Z"
    fill="none"
    stroke="#7c3aed"
    stroke-width="3"
  />

  <!-- Filamento Lumi: estrela de 4 pontas flat -->
  <polygon
    points="256,308 268,332 292,332 276,348 282,372 256,358 230,372 236,348 220,332 244,332"
    fill="#ffffff"
  />

  <!-- Base da lâmpada: 3 linhas horizontais minimalistas -->
  <path d="M 196 384 L 316 384" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
  <path d="M 204 396 L 308 396" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
  <path d="M 212 408 L 300 408" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>

  <!-- Ponta de contato inferior -->
  <rect x="240" y="416" width="32" height="20" fill="#7c3aed"/>
</svg>
